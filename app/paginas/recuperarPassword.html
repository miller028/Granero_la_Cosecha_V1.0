<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contrseña</title>
    <script src="recuperarPassword.js" defer></script>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <section class="fondo">
      <form align="center" id="recuperarPassword">
        <table align="center">
          <tr>
            <!-- Fila 1, con 0 Columnas -->
            <h3>Ingrese su correo con el que se registro</h3>
          </tr>
          <tr>
            <!-- Fila 2, con 0 Columnas -->
            <input
              type="email"
              name="correo"
              id="correo"
              placeholder="Ingrese su correo"
            />
          </tr>
          <tr>
            <!-- Fila 3, con 2 Columnas -->
            <td><a href="/">Salir</a></td>
            <td>
              <button type="submit" class="cambioDeColor">
                Recuperar contraseña
              </button>
            </td>
          </tr>
        </table>
      </form>
    </section>
  </body>
</html>
