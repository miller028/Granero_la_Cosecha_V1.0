<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="registro.js" defer></script>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <h2 class="texBienvenido">Bienvenidos</h2>
    <section class="fondo">
      <form align="center" id="login">
        <table align="center">
          <h2>Inicio de sesion</h2>
          <tr>
            <!-- Fila 1, con 2 Columnas -->
            <td><label for="correo">Correo:</label></td>
            <td><input type="email" name="correo" id="correo" /></td>
          </tr>
          <tr>
            <!-- Fila 2, con 2 Columnas -->
            <td>
              <label for="password">Contraseña:</label>
            </td>
            <td><input type="password" name="password" id="password" /></td>
          </tr>
          <tr>
            <!-- Fila 2, con 1 Columna -->
          </tr>
        </table>
        <table  align="center" class="tabla2">
          <tr>
            <!-- Fila 1 -->
             <button type="submit" class="cambioDeColor">Iniciar sesion</button>
          </tr>
          <tr>
            <tr>
            <!-- Fila 2, con 2 Columna -->
             <td><a href="/registro">¿No tienes una cuenta?</a></td>
             <td><a href="/recuperarPassword">¿Se te olvido la contraseña?</a></td>
          </tr>
          </tr>
        </table>
      </form>
    </section>
    <p>by: Ing. Miller Salas</p>
    <p>2026</p>
  </body>
</html>
