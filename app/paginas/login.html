<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="login.js" defer></script>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body id="fondo">
    <div class="card-box">
      <h2>Inicio de sesion</h2>
      <form id="login">
        <div class="mb-3">
          <label class="form-label" for="correo">Correo electronico:</label>
          <div class="input-group">
            <span class="input-group-text"
              ><i class="fa-solid fa-envelope"></i
            ></span>
            <input
              class="form-control"
              type="email"
              name="correo"
              id="correo"
              placeholder="tuemail@ejemplo.com"
            />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña:</label>
          <div class="input-group">
            <span class="input-group-text"
              ><i class="fa-solid fa-key"></i
            ></span>
            <input
              class="form-control"
              type="password"
              name="password"
              id="password"
              placeholder="**********"
            />
          </div>
        </div>
        <button class="bnt-main" type="submit">Iniciar sesion</button>
      </form>
      <p class="text-center mt-3">
        ¿No tienes una cuenta?<a href="/registro" id="colortexto">
          Registrate</a
        >
      </p>
      <p class="text-center mt-3">
        <a href="/recuperarPassword">¿Se te olvido la contraseña?</a>
      </p>
      <p class="text-center mt-3">by: Ing. Miller Salas</p>
      <p class="text-center mt-3">2026</p>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
